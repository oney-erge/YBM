[project]
name = "agent-control-backend"
version = "0.1.2"
description = "Configurable local agentic control system backend"
authors = [{ name = "oney-erge" }]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["agent", "automation", "fastapi", "local-first", "telegram"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  # Anthropic's API is not OpenAI-compatible and its own guidance is to use the
  # official SDK rather than a compatibility shim, so Claude gets a native
  # provider instead of a base_url entry in the catalog.
  "anthropic>=0.40",
  "fastapi>=0.115",
  "cryptography>=50.0.0",
  "httpx>=0.27",
  "json-repair>=0.59",
  "mcp>=1.2",
  "pandas>=2.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pillow>=10.0",
  "pypdf>=5.0",
  "pyyaml>=6.0",
  "structlog>=24.0",
  "uvicorn>=0.30",
  "websocket-client>=1.8",
]

[project.scripts]
ybm = "agent_control.cli:main"
# Entry point for .mcp.json. A console script rather than `python -m` so the
# launcher does not have to know where the interpreter lives - the previous
# config ran a bare `python` with a relative PYTHONPATH, which only resolved on
# a machine that happened to have a system Python carrying the dependencies.
ybm-mcp = "agent_control.mcp_server:main"

[project.urls]
Homepage = "https://github.com/oney-erge/YBM"
Issues = "https://github.com/oney-erge/YBM/issues"
Repository = "https://github.com/oney-erge/YBM.git"

[project.optional-dependencies]
# Desktop observation/control (computer.use, desktop.screenshot capabilities).
# Windows-only today; every import site lazy-imports these, so the package
# imports fine without this extra and only fails when a desktop tool actually runs.
desktop = [
  "mss>=10.0",
  "pyautogui>=0.9.54",
  "pygetwindow>=0.0.9",
  "pywinauto>=0.6.8; platform_system == 'Windows'",
]
voice = [
  "faster-whisper>=1.1",
  "kokoro-onnx>=0.5",
  "numpy>=2.0.2",
  "pyarrow>=24",
]
e2e = [
  "telethon>=1.36",
]
# System tray icon (scripts/tray_app.py, docs/UI_UX_AUDIT.md Phase 6) -
# pystray itself is cross-platform, but this product is only tested on
# Windows today (AGENTS.md).
tray = [
  "pystray>=0.19",
]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]
dev = [
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  # Raised at import time by starlette.testclient pointing at an "httpx2"
  # package that does not exist on PyPI yet - nothing actionable to do here
  # until Starlette ships a real replacement. StarletteDeprecationWarning
  # subclasses UserWarning, not DeprecationWarning - the category below must
  # match that exactly or this filter silently matches nothing. Scoped to
  # this exact message so other, real warnings still surface normally.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
