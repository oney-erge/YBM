name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release calls this workflow at the tag commit and cannot publish unless
  # every job below succeeds.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launchers:
    name: Launcher contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check POSIX and PowerShell syntax
        shell: pwsh
        run: |
          bash -n run.sh run.command ybm.sh
          shellcheck --severity=error run.sh run.command ybm.sh
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path run.ps1), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error }
      # install.sh is what the README's curl one-liner runs. A stray "+" in place of a line
      # continuation and CRLF in the release's SHA256SUMS.txt both broke it while this job was
      # green, because neither is a syntax error. Run its two helpers against local fixtures.
      - name: Exercise the Unix installer's download and checksum helpers
        run: |
          shellcheck --severity=error scripts/install.sh scripts/check_install_sh.sh
          bash scripts/check_install_sh.sh

  # Parsing a launcher proves it is valid syntax, not that it starts YBM. A
  # launcher that failed on every default start (and one that reported success
  # as failure) both passed the syntax job above, so run each one for real:
  # fresh checkout, default action, exit code, health check, stop.
  launcher-smoke:
    name: Launcher smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run the launcher (Windows PowerShell 5.1, as a double-click does)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\run.ps1 -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "run.ps1 exited $LASTEXITCODE" }
          $health = Invoke-RestMethod -Uri http://127.0.0.1:8765/health -TimeoutSec 10
          if ($health.status -ne "ok") { throw "health check returned: $($health | ConvertTo-Json -Compress)" }
          .\run.ps1 stop
          if ($LASTEXITCODE -ne 0) { throw "run.ps1 stop exited $LASTEXITCODE" }
      - name: Run the launcher (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Put the system bash first on PATH so the `#!/usr/bin/env bash`
          # scripts that run.sh execs get macOS's stock bash 3.2 (the one a user
          # actually has), not whatever newer bash the runner image added.
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
          export PATH="$RUNNER_TEMP/system-bash:$PATH"
          bash --version | head -1
          ./run.sh --no-browser
          curl -fsS --max-time 10 http://127.0.0.1:8765/health
          echo
          ./run.sh stop

  backend-tests:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          working-directory: backend
          cache-suffix: backend-tests-${{ matrix.os }}
      - run: uv sync --frozen --extra test --extra dev
      - run: uv run --frozen pytest

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          working-directory: backend
          cache-suffix: backend-quality
      - run: uv sync --frozen --extra test --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen --with pip-audit pip-audit
      - run: uv run --frozen python ../scripts/check_markdown_links.py
      - run: uv run --frozen python ../scripts/check_no_em_dash.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  whatsapp-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: whatsapp-bridge/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  vscode-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the headless image
        run: docker build --tag ybm-control:ci .
      - name: Check packaged runtime assets
        run: |
          docker run --rm --entrypoint sh ybm-control:ci -c '
            node --version &&
            test -f /app/whatsapp-bridge/src/index.js &&
            test -d /app/whatsapp-bridge/node_modules &&
            test -f /app/skills/starter/repo-review.md &&
            test -f /app/LICENSE &&
            ybm --help >/dev/null
          '
      # The claim `docker compose up -d` makes is "nothing to configure first".
      # Prove it: no .env, no token supplied, then check the container made its
      # own, refuses requests without it, hands out a signed-in link, and keeps
      # the same token when the container is recreated.
      - name: Start the container with no configuration
        run: |
          set -euo pipefail
          docker volume create ybm-ci-state >/dev/null
          start() {
            docker run -d --name ybm-ci -p 127.0.0.1:8765:8765 -v ybm-ci-state:/app/.agent_control ybm-control:ci >/dev/null
            for _ in $(seq 1 60); do
              curl -fsS --max-time 3 http://127.0.0.1:8765/health >/dev/null 2>&1 && return 0
              sleep 2
            done
            docker logs ybm-ci
            echo "container never became healthy" >&2
            return 1
          }
          start
          link="$(docker exec ybm-ci ybm admin-url)"
          echo "link shape: ${link%%token=*}token=<hidden>"
          case "$link" in http://127.0.0.1:8765/admin?token=?*) ;; *) echo "unexpected admin-url: ${link%%token=*}" >&2; exit 1 ;; esac
          token="${link#*token=}"

          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/admin/api/summary)"
          [ "$code" = 401 ] || { echo "API answered $code without a token (want 401)" >&2; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "X-Agent-Control-Admin-Token: $token" http://127.0.0.1:8765/admin/api/summary)"
          [ "$code" = 200 ] || { echo "API answered $code with the token (want 200)" >&2; exit 1; }

          # The one-time link becomes a lasting session cookie.
          curl -fsS -c /tmp/ybm-cookies -X POST -H "X-Agent-Control-Admin-Token: $token" http://127.0.0.1:8765/admin/api/session >/dev/null
          code="$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/ybm-cookies http://127.0.0.1:8765/admin/api/summary)"
          [ "$code" = 200 ] || { echo "session cookie was not accepted ($code)" >&2; exit 1; }

          # Recreate the container on the same volume: same token, still no config.
          docker rm -f ybm-ci >/dev/null
          start
          again="$(docker exec ybm-ci ybm admin-url)"
          [ "$again" = "$link" ] || { echo "token changed when the container was recreated" >&2; exit 1; }
      - name: Remove the test container
        if: always()
        run: |
          docker rm -f ybm-ci >/dev/null 2>&1 || true
          docker volume rm ybm-ci-state >/dev/null 2>&1 || true

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Run gitleaks directly rather than through gitleaks-action. The action
      # passes `--log-opts=-1` on a push, so it scans the last commit only -
      # this job was named "Scan Git history for leaked secrets" and had never
      # scanned any history, while fetch-depth: 0 above paid for the full clone
      # regardless. Invoking the binary makes the scope visible in the diff
      # instead of hidden in the action's defaults.
      - name: Scan Git history for leaked secrets
        env:
          GITLEAKS_VERSION: 8.24.3
          # From the release's own checksums file. Pinned so a compromised or
          # re-tagged release cannot silently become the thing auditing us.
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts=--all \
            --redact \
            --no-banner \
            --exit-code 1
