name: Release

# Publishes the Windows installers, cross-platform archives, and container for a tag.
#
# The reason this workflow exists: a source checkout has no admin console until
# someone installs Node.js 22.22+ and builds it, which is the one prerequisite a
# non-developer cannot reasonably be asked to satisfy. Building the console here
# and shipping it inside the payload turns Node.js back into a contributor tool.
#
# It also gives backend/src/agent_control/updates.py a stable release to find
# when `ybm run` performs its read-only update check.

on:
  push:
    tags: ["v*"]
  # Build the artifacts without publishing, to check a packaging change before
  # committing to a tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no v prefix). Artifacts only, no release."
        required: false
        default: "0.0.0-dev"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Full CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  container-test:
    name: Release container
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and inspect release image
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          docker build --build-arg "YBM_VERSION=$version" --tag ybm-release:test .
          docker run --rm --entrypoint sh ybm-release:test -c '
            node --version &&
            test -f /app/backend/src/agent_control/static/admin/index.html &&
            test -f /app/whatsapp-bridge/src/index.js &&
            test -f /app/skills/starter/repo-review.md &&
            ybm --help >/dev/null
          '

  windows:
    name: Installer and archives
    needs: [validate, container-test]
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      # For the build provenance attestation below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF -replace "^refs/tags/v", ""
          } else {
            $version = "${{ inputs.version }}"
          }
          if (-not $version) { throw "could not determine a version to build" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building YBM $version"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The console has to exist before packaging; package_release.py refuses
      # to build an archive without it rather than shipping a release that
      # serves build instructions.
      - name: Build the admin console
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Produces both archives: the .zip Windows users expect and the .tar.gz
      # for macOS/Linux. Python rather than PowerShell because only tarfile
      # lets a Windows host set the executable bit on ybm.sh, and a tarball
      # whose launcher is not executable is a broken download that looks fine.
      - name: Stage the release payload
        run: python scripts/package_release.py --version "${{ steps.version.outputs.version }}"

      # Pinned to v5: WiX v6 introduced the Open Source Maintenance Fee, whose
      # EULA must be accepted before the binaries run at all. v5 is the last
      # release without it. Installed as a dotnet tool rather than through a
      # marketplace action so the release path takes no third-party action
      # dependency.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build_msi.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Test MSI install, runtime setup, health, and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dist\YBM-Setup.msi").Path
          # Exercise the default per-user location used by an actual
          # double-click install. This also proves uninstall resolves the same
          # directory without relying on an out-of-band path override.
          $installDir = Join-Path $env:LOCALAPPDATA "YBM"
          $installLog = Join-Path $env:RUNNER_TEMP "ybm-msi-install.log"
          $uninstallLog = Join-Path $env:RUNNER_TEMP "ybm-msi-uninstall.log"

          function Invoke-Msi([string[]]$Arguments, [string]$Log) {
            $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList $Arguments
            if ($process.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $Log) { Get-Content -LiteralPath $Log -Tail 200 }
              throw "msiexec failed with exit $($process.ExitCode)"
            }
          }

          Invoke-Msi @("/i", "`"$msi`"", "/qn", "/norestart", "/L*V", "`"$installLog`"") $installLog
          foreach ($relative in @(
            "YBM.bat",
            "Install-YBM.bat",
            "scripts\ybm.ps1",
            "backend\src\agent_control\static\admin\index.html"
          )) {
            $path = Join-Path $installDir $relative
            if (-not (Test-Path -LiteralPath $path)) { throw "MSI did not install $relative" }
          }

          # Exercise the installed application, not the checkout. This is the
          # first-run work users were previously left to discover themselves.
          & "$installDir\scripts\ybm.ps1" setup --runtime-only --no-desktop
          if ($LASTEXITCODE -ne 0) { throw "installed runtime setup failed (exit $LASTEXITCODE)" }
          & "$installDir\scripts\ybm.ps1" doctor
          if ($LASTEXITCODE -ne 0) { throw "installed runtime doctor failed (exit $LASTEXITCODE)" }
          try {
            & "$installDir\scripts\ybm.ps1" start -NoTelegram -NoWhatsApp -NoWorker -NoScheduler -NoLocalDeploy -SkipDoctor
            if ($LASTEXITCODE -ne 0) { throw "installed backend start failed (exit $LASTEXITCODE)" }
            $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 10
            if ($health.status -ne "ok") { throw "installed backend health was not ok" }
          } finally {
            & "$installDir\scripts\ybm.ps1" stop
          }

          Invoke-Msi @("/x", "`"$msi`"", "/qn", "/norestart", "/L*V", "`"$uninstallLog`"") $uninstallLog
          if (Test-Path -LiteralPath (Join-Path $installDir "YBM.bat")) {
            throw "MSI uninstall left package-owned files behind"
          }

      - name: Stage double-click and PowerShell installers
        shell: pwsh
        run: |
          Copy-Item -LiteralPath Install-YBM.bat -Destination dist\Install-YBM.bat
          Copy-Item -LiteralPath scripts\install.ps1 -Destination dist\Install-YBM.ps1

      - name: Test double-click installer entry point
        shell: cmd
        env:
          YBM_INSTALLER_PS1_PATH: ${{ github.workspace }}\scripts\install.ps1
          YBM_INSTALL_DIR: ${{ runner.temp }}\ybm-batch-smoke
          YBM_DRY_RUN: "1"
          YBM_NO_PAUSE: "1"
        run: |
          cd /d "%RUNNER_TEMP%"
          call "%GITHUB_WORKSPACE%\Install-YBM.bat"

      # Publish exact hashes beside the downloads for independent verification.
      - name: Checksums
        shell: pwsh
        run: |
          $lines = @()
          foreach ($file in Get-ChildItem dist\*.zip, dist\*.tar.gz, dist\*.msi, dist\*.bat, dist\*.ps1) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            $lines += "$hash  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii
          $lines | ForEach-Object { Write-Host $_ }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ybm-windows-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.bat
            dist/*.ps1
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # Cryptographic proof that this exact installer was built by this
      # workflow from this repository, verifiable with `gh attestation verify`.
      # Signed through Sigstore with a short-lived certificate, so it costs
      # nothing and needs no code-signing certificate. It is the available
      # verification path until a conventional publisher certificate is in
      # place.
      #
      # It does not remove the SmartScreen prompt; nothing free does. It gives
      # a careful user something better than a hash on the same page that
      # served the download.
      #
      # Gated on visibility: attestations are free for public repositories, but
      # a private one needs GitHub Enterprise Cloud, and this step would fail
      # the release rather than skip.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/YBM-Setup.msi
            dist/*.zip
            dist/*.tar.gz
            dist/*.bat
            dist/*.ps1

  container-publish:
    name: Publish container
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and publish GHCR image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/oney-erge/ybm
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --build-arg "YBM_VERSION=$version" \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:latest" \
            .
          docker push "$IMAGE:$version"
          docker push "$IMAGE:latest"

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, container-publish]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ybm-windows-${{ needs.windows.outputs.version }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:VERSION -replace "^v", ""
          $installerSha = (Get-FileHash -LiteralPath dist\YBM-Setup.msi -Algorithm SHA256).Hash
          # Single-quoted here-string: the notes are full of backticks (code
          # fences and inline code), and inside a double-quoted here-string
          # PowerShell reads a backtick as an escape character. Placeholders are
          # substituted afterwards, and the result goes to gh via --notes-file.
          $notes = @'
          ## Install on Windows

          **Installer:** Download `YBM-Setup.msi`, open it, and leave **Launch YBM now** selected.
          It is a per-user install, needs no administrator rights, and includes the web console.

          **No MSI:** Download `Install-YBM.bat` and double-click it. The window shows each
          download, verification, setup, and launch step. It needs no signature or administrator
          account. `Install-YBM.ps1` is provided beside it for people who prefer PowerShell.

          Windows will warn that the publisher is unrecognised, because the installer is not
          code signed. That warning is expected and it is not evidence of anything either
          way, so verify the file instead of judging the dialog:

          ```
          # Proves it was built by this repo's release workflow, not just that
          # it matches a hash published on the same page as the download.
          gh attestation verify .\YBM-Setup.msi --repo oney-erge/YBM

          # Or, without gh:
          Get-FileHash .\YBM-Setup.msi -Algorithm SHA256
          # expect: __SHA__
          ```

          ### Or run it from a folder

          Extract `YBM-windows.zip` and double-click `YBM.bat`. It installs
          whatever is missing, including uv, then opens the console. This avoids the MSI;
          runtime caches and the uv launcher still use normal per-user locations.

          ## macOS and Linux

          ```
          tar -xzf YBM-unix.tar.gz
          cd YBM-__VERSION__ && ./ybm.sh
          ```

          `ybm.sh` installs whatever is missing, including uv and Python, then starts YBM
          and opens the console. Run it again any time; it does nothing when there is
          nothing to do. No Node.js needed - the console ships prebuilt in this archive.

          ## Verify any download

          ```
          gh attestation verify <file> --repo oney-erge/YBM
          ```

          Full checksums are in `SHA256SUMS.txt`.

          ## Docker

          ```
          docker pull ghcr.io/oney-erge/ybm:__VERSION__
          ```

          The image is also published as `ghcr.io/oney-erge/ybm:latest`. It is the headless
          profile: desktop control, visible Chrome, and the VS Code bridge require a host install.
          '@
          $notes = $notes.Replace("__SHA__", $installerSha).Replace("__VERSION__", $version)
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8
          gh release create "v$version" `
            dist\YBM-Setup.msi `
            dist\YBM-windows.zip `
            dist\YBM-unix.tar.gz `
            dist\Install-YBM.bat `
            dist\Install-YBM.ps1 `
            dist\SHA256SUMS.txt `
            --title "YBM $version" `
            --notes-file release-notes.md `
            --verify-tag `
            --repo oney-erge/YBM
