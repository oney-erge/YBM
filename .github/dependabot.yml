version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The backend uses the v1 FastMCP API; v2 needs an explicit migration.
    ignore:
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TasksPage uses the v8 table hooks removed in v9.
    ignore:
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        update-types: ["minor", "patch"]
