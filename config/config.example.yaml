server:
  host: "127.0.0.1"
  port: 8765
  public_base_url: null
  admin_enabled: true
  admin_token_env: "AGENT_ADMIN_TOKEN"

identity:
  instance_name: "ybm-control"
  owner_label: "local-user"

channels:
  telegram:
    enabled: false
    token_env: "TELEGRAM_BOT_TOKEN"
    allowed_user_ids: []
    allowed_chat_ids: []
    polling: true
  whatsapp:
    enabled: false
    # E.164-style numbers without the leading "+", e.g. "15551234567" -
    # empty means deny all. Put your own number here after linking; never
    # commit a real number to this file.
    allowed_numbers: []
    bridge_port: 8091
    node_path: null

llm:
  # Left empty on purpose. The first run (`ybm setup`, which every launcher
  # runs) fills it in from what is already on the machine: your own LocalDeploy
  # if YBM_LOCALDEPLOY_ROOT is set, a running Ollama, or a provider API key
  # already in your environment or .env. It never calls a paid API to decide,
  # and it tells you what it picked. The profiles below are reference shapes
  # you can point default_profile at by hand.
  default_profile: ""
  major_profile: null
  # No silent paid fallback: set one explicitly if you want a second model to
  # take over when the first is unreachable.
  fallback_profile: null
  profiles:
    # Claude. `provider: anthropic` routes to the native provider rather than
    # the OpenAI-compatible one, which matters: current Claude models reject
    # `temperature` with a 400, and the native provider omits it for them.
    # No base_url - the SDK supplies it.
    anthropic_sonnet:
      provider: "anthropic"
      model: "claude-sonnet-5"
      api_key_env: "ANTHROPIC_API_KEY"
      timeout_seconds: 120
      max_tokens: 4096
      temperature: 0.2
    # Any OpenAI-compatible endpoint is base_url plus a key. The console's
    # provider picker writes these for you, and verifies the key and one real
    # completion before saving.
    openrouter:
      provider: "openai_compatible"
      model: "anthropic/claude-sonnet-4.5"
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"
      timeout_seconds: 120
      max_tokens: 4096
      temperature: 0.2
    localdeploy_qwen3vl_8b:
      provider: "openai_compatible"
      model: "qwen3vl_8b_ollama"
      base_url: "http://127.0.0.1:8000/v1"
      api_key_env: null
      timeout_seconds: 800
      max_tokens: 4096
      temperature: 0.1
      context_limit: 32768
    localdeploy_gemma3_12b:
      provider: "openai_compatible"
      model: "gemma3_12b_ollama_safe"
      base_url: "http://127.0.0.1:8000/v1"
      api_key_env: null
      timeout_seconds: 360
      max_tokens: 9000
      temperature: 0.2
      context_limit: 32768
    localdeploy_gemma3_4b:
      provider: "openai_compatible"
      model: "gemma3_4b_ollama_safe"
      base_url: "http://127.0.0.1:8000/v1"
      api_key_env: null
      timeout_seconds: 180
      max_tokens: 9000
      temperature: 0.2
      context_limit: 32768
    openai_saved:
      provider: "openai_compatible"
      model: "gpt-4.1"
      base_url: "https://api.openai.com/v1"
      api_key_env: "OPENAI_API_KEY"
      timeout_seconds: 60
      max_tokens: 4096
      temperature: 0.2

capabilities:
  # YBM's own built-in helpers (task status, skills, persona, notes search): local
  # reads of its own state, no reason to ask.
  agent.core:
    enabled: true
    scopes: []
    requires_approval: false
    max_risk_level: "low"
  telegram.receive:
    enabled: true
    scopes: []
    requires_approval: false
    max_risk_level: "low"
  telegram.send:
    enabled: true
    scopes: []
    requires_approval: false
    max_risk_level: "low"
  terminal.run:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "critical"
  filesystem.read:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "low"
  filesystem.write:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "critical"
  vscode.read_state:
    enabled: false
    scopes: []
    requires_approval: false
    max_risk_level: "low"
  vscode.write_files:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "high"
  desktop.screenshot:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "medium"
  desktop.control:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "critical"
  browser.open:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "medium"
  browser.control:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "critical"
  network.http:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "high"
  schedule.manage:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "medium"
  github.push:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "critical"
  dependencies.install:
    enabled: false
    scopes: []
    requires_approval: true
    max_risk_level: "high"
  memory.manage:
    enabled: false
    scopes: []
    # docs/UI_UX_AUDIT.md Phase 15: requires_approval stays false here
    # (unlike schedule.manage above, which gates every operation at this
    # level) so list/remember stay approval-free - the tool's own
    # approval_required_operations=("forget",) is what gates forget
    # specifically. max_risk_level is "medium", not "low", only because
    # forget's own operation_risks entry is medium and a lower ceiling here
    # would deny it outright instead of routing it to approval.
    requires_approval: false
    max_risk_level: "medium"

approval_policy:
  default_timeout_seconds: 900
  # Authoritative across every capability and access mode. A capability's
  # requires_approval: false does not bypass this floor.
  require_approval_at_or_above: "medium"
  approval_token_ttl_seconds: 900

storage:
  database_url: "sqlite:///.agent_control/agent_control.db"
  artifact_dir: ".agent_control/artifacts"
  # Task/audit history is kept forever by default - `ybm db-clean --days N`
  # stays available as a manual, one-time action either way. Uncomment to
  # have the scheduler delete rows older than N days on its own, once a day.
  # retention_days: 90

secrets:
  path: ".agent_control/secrets/vault.json"
  key_env: "AGENT_SECRET_VAULT_KEY"

logging:
  level: "INFO"
  json_logs: true
  redact_patterns:
    - "token"
    - "api_key"
    - "secret"
    - "password"
    - "authorization"
    - "cookie"

limits:
  max_parallel_tasks: 1
  max_retries: 3
  tool_timeout_seconds: 900
  max_log_chars: 12000
  retry_backoff_seconds: 30

# The Operator loop (observe -> decide -> act) is the sole execution path.
operator:
  # Hard ceiling on REAL tool calls per task - the only backstop against a
  # model that never converges. Fulfillment/audit check entries do not count
  # against it. Raise for genuinely long multi-tool work; lower to fail fast.
  max_steps: 12

adapters:
  vscode:
    enabled: false
    bridge_host: "127.0.0.1"
    bridge_port: 8766
    auth_token_env: "VSCODE_BRIDGE_TOKEN"
  workspace:
    enabled: true
    root_dir: ".agent_control/workspaces"
    web_host: "127.0.0.1"
    web_port_start: 8890
    open_browser: true
  browser:
    enabled: true
    host: "127.0.0.1"
    remote_debugging_port: 9222
    chrome_path: null
    user_data_dir: ".agent_control/browser/chrome-profile"
    screenshot_dir: ".agent_control/browser/screenshots"
    launch_if_missing: true
    startup_timeout_seconds: 10
    default_wait_seconds: 1.5
    max_summary_chars: 6000
    search_url_template: "https://www.bing.com/search?q={query}"
  adapter_factory:
    enabled: true
    root_dir: ".agent_control/adapters"
  http_request:
    enabled: true
    allowed_hosts: []
    allowed_url_prefixes: []
    blocked_hosts: []
    timeout_seconds: 30
    max_response_chars: 100000
    max_body_chars: 100000
    user_agent: "YBM-http-request/1.0"
  terminal:
    enabled: false
    allowed_working_dirs: []
    blocked_command_patterns:
      - "rm -rf"
      - "del /s"
      - "format "
  coding_assistant:
    enabled: false
    command_template: []
    working_dir: null
    timeout_seconds: 900
    output_limit_chars: 12000
    rate_limit_patterns:
      - "rate limit"
      - "too many requests"
    usage_limit_patterns:
      - "usage limit"
      - "quota exceeded"
  coding_agent:
    enabled: true
    workspace_root: ".agent_control/workspaces"
    session_root: ".agent_control/coding_sessions"
    codex_path: null
    copilot_path: null
    claude_path: null
    use_runner: true
    timeout_seconds: 3600
    start_wait_seconds: 20
    progress_interval_seconds: 300
    output_limit_chars: 20000
    rate_limit_patterns:
      - "rate limit"
      - "too many requests"
    usage_limit_patterns:
      - "usage limit"
      - "quota exceeded"
      - "quota_exceeded"
      - "no quota"
      - "limit reached"
      - "messages are exhausted"
    codex_sandbox: "workspace-write"
    codex_skip_git_repo_check: true
    claude_permission_mode: "acceptEdits"
    copilot_allow_all: true
    copilot_no_ask_user: true
  code_interpreter:
    enabled: true
    workspace_root: ".agent_control/code_interpreter"
    timeout_seconds: 60
    max_code_chars: 20000
    max_output_chars: 12000
    max_files_listed: 200
    python_executable: null
    default_backend: "local_subprocess"
    backends:
      - "local_subprocess"
    untrusted_default_backend: "docker_python"
    # When true (default), untrusted/LLM-generated code silently runs unsandboxed
    # on the host (local_subprocess) if Docker is disabled/unavailable - check
    # code.interpreter health for a safety_warnings entry when that happens.
    # Set to false to refuse untrusted runs instead of falling back.
    fallback_to_local_when_backend_unavailable: true
    require_approval_for_untrusted_run_python: true
    network_policy: "disabled_by_default"
    package_policy: "disabled"
    allowed_packages: []
    resource_limits:
      memory: "512m"
      cpus: 1.0
      pids_limit: 128
    docker:
      enabled: false
      image: "python:3.12-slim"
      docker_path: "docker"
      pull_policy: "missing"
      network_enabled: false
      read_only_rootfs: false
      workspace_mount_target: "/workspace"
      remove_container: true
      run_as_user: null
    jupyter:
      enabled: false
      image: "python:3.12-slim"
      idle_timeout_seconds: 900
    remote_backends: {}
    session_ttl_seconds: 900
    allowed_imports:
      - "base64"
      - "collections"
      - "csv"
      - "datetime"
      - "decimal"
      - "functools"
      - "hashlib"
      - "html"
      - "itertools"
      - "json"
      - "math"
      - "pathlib"
      - "random"
      - "re"
      - "statistics"
      - "string"
      - "textwrap"
      - "typing"
      - "xml"
      - "zipfile"
    blocked_imports:
      - "ctypes"
      - "httpx"
      - "os"
      - "pip"
      - "requests"
      - "shutil"
      - "socket"
      - "subprocess"
      - "sys"
      - "urllib"
  desktop:
    screenshot_enabled: false
    control_enabled: false
    screenshot_interval_seconds: 10
    screenshot_format: "png"
  computer_use:
    enabled: false
    max_steps: 8
    step_delay_seconds: 0.4
    screenshot_dir: ".agent_control/computer_use/screenshots"
    allowed_apps: []
    allowed_roots:
      - ".agent_control/workspaces"
    require_session_approval: true
    max_ui_elements: 80
  artifact_delivery:
    recent_artifact_fallback_enabled: false
  stt:
    enabled: false
    provider: "faster_whisper"
    model: "base"
    device: "cpu"
    compute_type: "int8"
    language: null
    vad_filter: true
    beam_size: 5
    timeout_seconds: 120
    temp_dir: ".agent_control/stt"
    command: []
    static_transcript_env: "AGENT_STT_STATIC_TRANSCRIPT"
  tts:
    enabled: false
    provider: "kokoro_onnx"
    model_path: null
    voices_path: null
    voice: "af_sarah"
    language: "en-us"
    speed: 1.0
    output_dir: ".agent_control/tts"
    timeout_seconds: 120
  skills:
    # User-droppable capability packs - drop a .md file (YAML frontmatter
    # with name/description, then instructions as the body) into root_dir
    # and it's available via the skills.use tool on the worker's next call,
    # no restart or code change needed. See docs/HISTORY.md Part 4 T1.3.
    enabled: true
    root_dir: ".agent_control/skills"
    max_skills_listed: 50
  persona:
    # One global identity/preference document, injected into every Operator
    # prompt - distinct from the per-conversation memory above. Edit the
    # file directly, or let the model update it via persona.manage when it
    # learns something durable. See docs/HISTORY.md Part 4 T2.5.
    enabled: true
    path: ".agent_control/persona.md"
    max_chars: 4000
  knowledge_base:
    # Local, personal document search (notes, reference material) by
    # keyword overlap, not embeddings - see docs/HISTORY.md Part 4 T2.7 for
    # why. Drop files under root_dir; knowledge.search re-indexes fresh on
    # every call, no separate indexing step.
    enabled: true
    root_dir: ".agent_control/knowledge"
    max_files_indexed: 500
    max_chars_per_file: 20000
    max_results: 5

mcp:
  enabled: false
  cache_ttl_seconds: 60
  catalog_path: ".agent_control/mcp/tool_catalog.json"
  servers: {}
