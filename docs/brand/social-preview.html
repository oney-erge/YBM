<!doctype html>
<!--
  Source for docs/brand/social-preview.png, the 1280x640 card GitHub shows when the repo is linked.
  Render it at a 1280x640 viewport, for example:
    npx playwright screenshot --viewport-size=1280,640 docs/brand/social-preview.html docs/brand/social-preview.png
  The words are claims about the product: keep them in line with the README.
  social-frame.png is one frame of the replay of a real run (docs/demo, scene "organize", at its approval).
-->
<html lang="en"><head><meta charset="utf-8"><title>YBM</title>
<style>
  @font-face { font-family: "Geist"; src: url("../demo/stage/fonts/Geist-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Geist"; src: url("../demo/stage/fonts/Geist-SemiBold.ttf"); font-weight: 600; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative; color: #e9edf7; font-family: "Geist", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(560px 420px at 22% 45%, rgba(98, 116, 232, 0.22), transparent 70%),
      linear-gradient(180deg, #0a1020 0%, #070b16 100%);
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 78px; height: 78px; }
  h1 { margin: 0; font-size: 92px; font-weight: 600; letter-spacing: 0.01em; line-height: 1; }
  p { margin: 28px 0 0; font-size: 33px; line-height: 1.28; font-weight: 600; color: #e9edf7; }
  .sub { margin-top: 22px; font-size: 21px; line-height: 1.45; color: #8f99b3; font-weight: 400; }
  .shot { position: absolute; right: -40px; top: 96px; width: 690px; border-radius: 18px; overflow: hidden;
          border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); }
  .shot img { display: block; width: 100%; }
</style></head>
<body>
  <div class="copy">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="YBM">
        <path d="M 150 150 L 256 256 L 362 150 M 256 256 V 366" fill="none" stroke="#6274e8" stroke-linecap="round" stroke-linejoin="round" stroke-width="100"/>
      </svg>
      <h1>YBM</h1>
    </div>
    <p>An assistant for your own computer that runs on a local language model and records what it did.</p>
    <div class="sub">Message it from your phone. You choose how much it asks, and it never spends money without a yes.</div>
  </div>
  <div class="shot"><img src="social-frame.png" alt=""></div>
</body></html>
